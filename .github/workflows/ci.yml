name: RDS CI

on:
  push:
    branches: [develop, main, 'feature/**']
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: CI Terraform e guard do RDS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes de segurança e matriz dos workflows
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra
      - name: Terraform init sem backend
        run: terraform -chdir=infra init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=infra validate
