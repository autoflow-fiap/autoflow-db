name: RDS Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: autoflow-db-rds-homolog
  cancel-in-progress: false

jobs:
  validate:
    name: CI Terraform e guard do RDS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes de segurança do Terraform
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra
      - name: Terraform init sem backend
        run: terraform -chdir=infra init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=infra validate

  plan:
    name: Terraform Plan homolog
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY }}
      TF_VAR_aws_allowed_account_ids: '["${{ vars.AWS_EXPECTED_ACCOUNT_ID }}"]'
      TF_VAR_region_default: ${{ vars.AWS_REGION }}
      TF_VAR_terraform_state_bucket: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_VAR_infra_state_key: ${{ vars.AWS_INFRA_STATE_KEY }}
      TF_VAR_database_username: ${{ secrets.DATABASE_USERNAME }}
      TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Testar guard de conta AWS
        run: python -m unittest discover -s scripts -p 'test_verify_aws_account.py' -v
      - name: Exigir credenciais temporárias e configuração explícita
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_SESSION_TOKEN"
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          test -n "$AWS_EXPECTED_ACCOUNT_ID"
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_KEY"
          test -n "$TF_VAR_infra_state_key"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Validar conta, região, bucket e states remotos
        env:
          AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_aws_account.py
          test "$(aws ec2 describe-availability-zones --region "$AWS_REGION" --query 'AvailabilityZones[0].RegionName' --output text)" = "$AWS_REGION"
          aws s3api head-bucket --bucket "$TF_STATE_BUCKET"
          aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$TF_VAR_infra_state_key" > /dev/null
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Inicializar state remoto existente
        env:
          AWS_TERRAFORM_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
          AWS_TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY }}
        run: |
          python scripts/state_resource_guard.py --bucket "$AWS_TERRAFORM_STATE_BUCKET" --key "$AWS_TF_STATE_KEY" -- aws rds describe-db-instances --db-instance-identifier autoflow-db --query 'DBInstances[0].DBInstanceIdentifier' --output text
          python scripts/state_resource_guard.py --bucket "$AWS_TERRAFORM_STATE_BUCKET" --key "$AWS_TF_STATE_KEY" -- aws rds describe-db-subnet-groups --db-subnet-group-name autoflow-db-subnet-group --query 'DBSubnetGroups[0].DBSubnetGroupName' --output text
          python scripts/state_resource_guard.py --bucket "$AWS_TERRAFORM_STATE_BUCKET" --key "$AWS_TF_STATE_KEY" -- aws ec2 describe-security-groups --region "$AWS_REGION" --filters Name=group-name,Values=autoflow-rds-sg --query 'SecurityGroups[0].GroupId' --output text
          python scripts/state_resource_guard.py --bucket "$AWS_TERRAFORM_STATE_BUCKET" --key "$AWS_TF_STATE_KEY" -- aws ec2 describe-security-groups --region "$AWS_REGION" --filters Name=group-name,Values=autoflow-lambda-sg --query 'SecurityGroups[0].GroupId' --output text
          cd infra
          terraform init -input=false -reconfigure -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=$TF_STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="allowed_account_ids=$TF_VAR_aws_allowed_account_ids" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Terraform validate
        working-directory: infra
        run: terraform validate
      - name: Gerar plano confidencial sem imprimir conteúdo
        working-directory: infra
        shell: bash
        run: terraform plan -input=false -no-color -out=rds.tfplan > /dev/null 2>&1
      - name: Bloquear exclusões e substituições
        working-directory: infra
        run: python ../scripts/review_rds_plan.py rds.tfplan
      - name: Calcular integridade do plano
        working-directory: infra
        run: sha256sum rds.tfplan > rds.tfplan.sha256
      - name: Armazenar plano confidencial desta execução
        uses: actions/upload-artifact@v4
        with:
          name: rds-tfplan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            infra/rds.tfplan
            infra/rds.tfplan.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  apply:
    name: Terraform Apply homolog (aprovação requerida)
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: plan
    runs-on: ubuntu-latest
    environment: homolog
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY }}
      TF_VAR_aws_allowed_account_ids: '["${{ vars.AWS_EXPECTED_ACCOUNT_ID }}"]'
      TF_VAR_region_default: ${{ vars.AWS_REGION }}
      TF_VAR_terraform_state_bucket: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_VAR_infra_state_key: ${{ vars.AWS_INFRA_STATE_KEY }}
      TF_VAR_database_username: ${{ secrets.DATABASE_USERNAME }}
      TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Exigir guard e Required reviewers efetivos
        env:
          APPROVAL_CONFIGURED: ${{ vars.TERRAFORM_APPLY_APPROVAL_CONFIGURED }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVAL_CONFIGURED" = "true" || {
            echo "TERRAFORM_APPLY_APPROVAL_CONFIGURED deve ser true no environment homolog." >&2
            exit 1
          }
          REVIEWERS=$(gh api "repos/$GITHUB_REPOSITORY/environments/homolog" --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length')
          test "$REVIEWERS" -gt 0 || {
            echo "O environment homolog não possui Required reviewers configurados; Apply bloqueado." >&2
            exit 1
          }
      - name: Exigir credenciais temporárias e configuração AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_SESSION_TOKEN"
          test -n "$AWS_EXPECTED_ACCOUNT_ID"
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_KEY"
          test -n "$TF_VAR_infra_state_key"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Revalidar conta, região, bucket e states remotos
        env:
          AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_aws_account.py
          test "$(aws ec2 describe-availability-zones --region "$AWS_REGION" --query 'AvailabilityZones[0].RegionName' --output text)" = "$AWS_REGION"
          aws s3api head-bucket --bucket "$TF_STATE_BUCKET"
          aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$TF_VAR_infra_state_key" > /dev/null
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Baixar plano desta execução
        uses: actions/download-artifact@v4
        with:
          name: rds-tfplan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra
      - name: Validar integridade do plano
        working-directory: infra
        run: sha256sum --check rds.tfplan.sha256
      - name: Inicializar state remoto existente
        working-directory: infra
        run: terraform init -input=false -reconfigure -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=$TF_STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="allowed_account_ids=$TF_VAR_aws_allowed_account_ids" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Revalidar bloqueio de ações destrutivas
        working-directory: infra
        run: python ../scripts/review_rds_plan.py rds.tfplan
      - name: Aplicar exatamente o plano revisado
        working-directory: infra
        run: terraform apply -input=false rds.tfplan
